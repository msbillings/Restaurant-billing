<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="msGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="512" height="512" rx="128" fill="url(#msGradient)"/>
  
  <!-- MS Monogram Text -->
  <text x="256" y="335" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif" font-size="240" font-weight="900" letter-spacing="-8" filter="url(#shadow)">MS</text>
  
  <!-- Golden Crown Sparkle Dot -->
  <circle cx="395" cy="125" r="28" fill="#fbbf24"/>
</svg>
