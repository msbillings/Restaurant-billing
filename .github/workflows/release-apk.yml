name: Release Android APK

on:
  push:
    tags:
      - "apk-v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v6.0.99)"
        required: true
        default: "v6.0.99"

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: 🤖 Build Android .APK
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: ☕ Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ── Increase Gradle heap so Kotlin compiler doesn't OOM ──────────
      - name: 🔧 Set Gradle JVM heap (4 GB)
        working-directory: ./Frontend/android
        shell: pwsh
        run: |
          $props = "Frontend/android/gradle.properties"
          if (Test-Path $props) {
            (Get-Content $props) -replace 'org\.gradle\.jvmargs=.*', 'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8' | Set-Content $props
          }

      - name: 📦 Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm install

      - name: 🏗️ Build Frontend (Web Assets)
        working-directory: ./Frontend
        run: npm run build

      - name: 📱 Sync Capacitor → Android
        working-directory: ./Frontend
        run: npx cap sync android

      # ── Keystore ─────────────────────────────────────────────────────
      - name: 🔑 Generate Release Keystore
        working-directory: ./Frontend/android
        shell: pwsh
        run: |
          if (Test-Path "keystore.jks") { Remove-Item -Force "keystore.jks" }
          keytool -genkeypair -v -keystore keystore.jks -alias msbilling `
            -keyalg RSA -keysize 2048 -validity 10000 `
            -storepass "MsBilling@2026#Secure!" `
            -keypass  "MsBilling@2026#Secure!" `
            -dname "CN=MS Billing, OU=Restaurant, O=MS Billings, L=City, ST=State, C=IN"

      # ── Build ─────────────────────────────────────────────────────────
      - name: 🔨 Assemble Release APK
        working-directory: ./Frontend/android
        shell: pwsh
        env:
          KEYSTORE_PASSWORD: "MsBilling@2026#Secure!"
          KEY_ALIAS:         "msbilling"
          KEY_PASSWORD:      "MsBilling@2026#Secure!"
          GRADLE_OPTS:       "-Dorg.gradle.daemon=true -Dorg.gradle.parallel=true"
        run: .\gradlew.bat assembleRelease --stacktrace --warning-mode all

      # ── Rename to friendly filename ───────────────────────────────────
      - name: 📝 Rename APK
        shell: pwsh
        run: |
          $apk = Get-ChildItem "Frontend/android/app/build/outputs/apk/release/*.apk" | Select-Object -First 1
          if ($apk) {
            $dest = "Frontend/android/app/build/outputs/apk/release/app-release.apk"
            if ($apk.FullName -ne $dest) { Rename-Item $apk.FullName "app-release.apk" }
            Write-Host "APK ready: $dest"
          }

      # ── Upload to GitHub Release ──────────────────────────────────────
      - name: 📤 Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: "MS Billings ${{ github.ref_name || inputs.tag_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: Frontend/android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Cleanup ───────────────────────────────────────────────────────
      - name: 🧹 Cleanup Keystore
        if: always()
        shell: pwsh
        run: Remove-Item "Frontend/android/keystore.jks" -Force -ErrorAction SilentlyContinue
