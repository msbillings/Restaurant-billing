name: Build and Release Auto-Updater

on:
  push:
    branches:
      - main
    paths:
      - 'Desktop/**'
      - 'Frontend/**'
      - 'Backend/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (.EXE and .APK)
    runs-on: windows-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🏷️ Get App Version
        id: get_version
        shell: pwsh
        run: |
          $ver = (Get-Content ./Desktop/package.json | ConvertFrom-Json).version
          echo "version=v$ver" >> $env:GITHUB_OUTPUT

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ☕ Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📦 Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm install

      - name: 📦 Install Desktop Dependencies
        working-directory: ./Desktop
        run: npm install

      - name: 🏗️ Build Frontend Web Assets
        working-directory: ./Frontend
        run: npm run build

      - name: 📱 Sync Capacitor Android
        working-directory: ./Frontend
        run: npx cap sync android

      - name: 🔑 Generate Release Keystore
        working-directory: ./Frontend/android
        run: |
          if (Test-Path "keystore.jks") { Remove-Item -Force "keystore.jks" }
          keytool -genkeypair -v -keystore keystore.jks -alias msbilling -keyalg RSA -keysize 2048 -validity 10000 -storepass "MsBilling@2026#Secure!" -keypass "MsBilling@2026#Secure!" -dname "CN=MS Billing, OU=Restaurant, O=MS Billings, L=City, ST=State, C=IN"

      - name: 🔨 Build Android APK (.apk)
        working-directory: ./Frontend/android
        env:
          KEYSTORE_PASSWORD: "MsBilling@2026#Secure!"
          KEY_ALIAS: "msbilling"
          KEY_PASSWORD: "MsBilling@2026#Secure!"
        run: |
          for ($i=1; $i -le 3; $i++) {
            .\gradlew.bat assembleRelease assembleDebug
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Attempt $i failed. Retrying in 10s..."
            Start-Sleep -Seconds 10
          }
          exit 1

      - name: 🚀 Build Desktop App (.exe)
        working-directory: ./Desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"
        run: |
          npm run prebuild
          for ($i=1; $i -le 3; $i++) {
            npx electron-builder --win -p never
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Attempt $i failed. Retrying in 10s..."
            Start-Sleep -Seconds 10
          }
          exit 1

      - name: 📦 Upload Release Assets (.EXE & .APK) to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          files: |
            Desktop/dist/*.exe
            Desktop/dist/*.blockmap
            Desktop/dist/latest.yml
            Frontend/android/app/build/outputs/apk/release/*.apk
            Frontend/android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
