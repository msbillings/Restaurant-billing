name: Build and Release Auto-Updater

on:
  push:
    branches:
      - main
    paths:
      - 'Desktop/**'
      - 'Frontend/**'
      - 'Backend/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (.EXE and .APK)
    runs-on: windows-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ☕ Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📦 Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm install

      - name: 📦 Install Desktop Dependencies
        working-directory: ./Desktop
        run: npm install

      - name: 🏗️ Build Frontend Web Assets
        working-directory: ./Frontend
        run: npm run build

      - name: 📱 Sync Capacitor Android
        working-directory: ./Frontend
        run: npx cap sync android

      - name: 🔨 Build Android APK (.apk)
        working-directory: ./Frontend/android
        run: .\gradlew.bat assembleRelease assembleDebug

      - name: 🚀 Build and Publish Desktop App (.exe)
        working-directory: ./Desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run prebuild && npx electron-builder --win -p always

      - name: 📱 Upload APK Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          files: |
            Frontend/android/app/build/outputs/apk/release/*.apk
            Frontend/android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
