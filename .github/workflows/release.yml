name: Build and Release MS Billing

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ─── Windows EXE ──────────────────────────────────────────────────────────
  build-exe:
    name: Build Windows .EXE
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 📦 Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm install

      - name: 🏗️ Build Frontend
        working-directory: ./Frontend
        run: npm run build

      - name: 📦 Install Backend Dependencies
        working-directory: ./Backend
        run: npm install --omit=dev

      - name: 📦 Install Desktop Dependencies
        working-directory: ./Desktop
        run: npm install

      - name: 🔄 Run Desktop Prebuild
        working-directory: ./Desktop
        run: npm run prebuild

      - name: 🚀 Build and Publish EXE to GitHub Releases
        working-directory: ./Desktop
        run: npx electron-builder -p always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Android APK ──────────────────────────────────────────────────────────
  build-apk:
    name: Build Android .APK
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: ☕ Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 📦 Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm install

      - name: 🏗️ Build Frontend
        working-directory: ./Frontend
        run: npm run build

      - name: 📱 Sync Capacitor Android
        working-directory: ./Frontend
        run: npx cap sync android

      - name: 🔑 Generate Release Keystore
        working-directory: ./Frontend/android
        run: |
          if (Test-Path "keystore.jks") { Remove-Item -Force "keystore.jks" }
          keytool -genkeypair -v -keystore keystore.jks -alias msbilling -keyalg RSA -keysize 2048 -validity 10000 `
            -storepass "MsBilling@2026#Secure!" -keypass "MsBilling@2026#Secure!" `
            -dname "CN=MS Billing, OU=Restaurant, O=MS Billings, L=City, ST=State, C=IN"

      - name: 🔨 Build Android APK
        working-directory: ./Frontend/android
        env:
          KEYSTORE_PASSWORD: "MsBilling@2026#Secure!"
          KEY_ALIAS: "msbilling"
          KEY_PASSWORD: "MsBilling@2026#Secure!"
        run: .\gradlew.bat assembleRelease assembleDebug

      - name: 📤 Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            Frontend/android/app/build/outputs/apk/release/*.apk
            Frontend/android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧹 Cleanup Keystore
        if: always()
        working-directory: ./Frontend/android
        shell: pwsh
        run: Remove-Item keystore.jks -Force -ErrorAction SilentlyContinue

  # ─── macOS DMG ───────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS .DMG
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 📦 Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm install

      - name: 🏗️ Build Frontend
        working-directory: ./Frontend
        run: npm run build

      - name: 📦 Install Backend Dependencies
        working-directory: ./Backend
        run: npm install --omit=dev

      - name: 📦 Install Desktop Dependencies
        working-directory: ./Desktop
        run: npm install

      - name: 🔄 Run Desktop Prebuild
        working-directory: ./Desktop
        run: npm run prebuild

      - name: 🍏 Build and Publish DMG to GitHub Releases
        working-directory: ./Desktop
        run: npx electron-builder --mac dmg -p always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── iOS IPA ─────────────────────────────────────────────────────────────
  build-ios:
    name: Build iOS .IPA
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 📦 Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm install

      - name: 🏗️ Build Frontend
        working-directory: ./Frontend
        run: npm run build

      - name: 📱 Sync Capacitor iOS
        working-directory: ./Frontend
        run: npx cap sync ios

      - name: 🍎 Build iOS IPA
        working-directory: ./Frontend/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO || true
          if [ -d "build/App.xcarchive" ]; then
            mkdir -p build/Payload
            cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
            cd build && zip -r MS-Billings.ipa Payload
          else
            echo "IPA build step finished"
          fi

      - name: 📤 Upload IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: ${{ github.ref_name }}
          files: Frontend/ios/App/build/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

